[project]
name = "scoutbase"
version = "0.1.0"
description = "Football recruitment data platform: multi-provider event data, canonical model, recruitment workflow."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dorin Dascălu" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
scoutbase = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
